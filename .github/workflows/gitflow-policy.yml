name: Git Flow policy

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    if: github.event_name == 'pull_request' || github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Validate feature branch and reviewer approval
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request || (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            })).data;

            if (pull.base.ref !== 'develop') {
              core.info('Policy only applies to PRs targeting develop.');
              return;
            }

            if (!pull.head.ref.startsWith('feature/')) {
              core.setFailed(`PR vào develop phải đến từ feature/<ID-Story>-<ten-tinh-nang>. Nhánh hiện tại: ${pull.head.ref}`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            });

            const latestByUser = new Map();
            for (const review of reviews) {
              if (review.user?.login) latestByUser.set(review.user.login, review.state);
            }
            const approved = [...latestByUser.entries()].filter(([login, state]) => state === 'APPROVED' && login !== pull.user.login);
            if (approved.length < 1) {
              core.setFailed('PR vào develop cần ít nhất 01 reviewer khác tác giả phê duyệt trước khi merge.');
            } else {
              core.info(`Git Flow policy passed with ${approved.length} reviewer approval(s).`);
            }
